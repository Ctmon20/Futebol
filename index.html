<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analise Pro | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="//static.surfe.pro/js/net.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #071B2A 0%, #0A263C 100%); min-height: 100vh; }
        .glass { background: rgba(16, 59, 85, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-modulo { width: 100%; padding: 12px 16px; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; text-align: center; }
        table { font-size: 0.7rem; }
        th, td { padding: 6px !important; }
        #contador { display: inline-block; margin: 0 auto; }
    </style>
</head>
<body class="text-white p-4">

    <div id="app" class="max-w-5xl mx-auto">
        <div id="menu-screen" class="flex flex-col items-center justify-center py-10 animate-in fade-in duration-700">
            <div class="mb-8 text-center">
                <h1 class="text-4xl font-extrabold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-blue-500">ANALISE PRO</h1>
                <p class="text-blue-200 opacity-80 text-sm">Selecione um módulo</p>
            </div>
            <div id="menu" class="grid grid-cols-1 gap-4 w-full max-w-sm"></div>
        </div>

        <div id="data-screen" class="hidden animate-in zoom-in duration-300">
            <div class="flex flex-col mb-6">
                <button onclick="voltar()" class="self-start mb-4 flex items-center gap-2 bg-[#103B55] hover:bg-[#1a5a80] px-4 py-1.5 rounded-full text-sm transition-all border border-blue-500/30">← Voltar</button>
                <div class="text-center">
                    <h2 id="nome-modulo" class="text-xl font-bold mb-1"></h2>
                    <p id="contador" class="text-green-400 text-xs font-mono bg-blue-950/30 px-3 py-1 rounded-full">Atualizando em: 300s</p>
                </div>
            </div>

            <div class="glass p-3 rounded-2xl shadow-2xl overflow-x-auto">
                <div id="tabela-container"></div>
            </div>

            <div id="banner" class="hidden mt-6 p-2 bg-white/5 rounded-xl border border-dashed border-white/20 text-center overflow-hidden">
                <div id="ad-wrapper">
                    <ins class="surfe-be" data-sid="420519"></ins>
                </div>
            </div>
        </div>
    </div>

    <script>
        const MODULOS = {
            "Tabela Série A": "1391365116",
            "Tabela Série B": "109280208",
            "Tabela Série C": "794662485",
            "Jogos do dia": "1702201024",
            "Análise": "2135486228"
        };

        const URL_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQWOmXcfQXxPCTcaMeqUqMH95gAylWlYPTrFvVoild6xdnFN242cJizsi-p9T8Gko7iM00bT7zGDbkz/pub?gid={gid}&single=true&output=csv";
        let intervalId = null;
        let adIntervalId = null;

        const menuEl = document.getElementById('menu');
        Object.keys(MODULOS).forEach(nome => {
            const btn = document.createElement('div');
            btn.className = "btn-modulo glass rounded-2xl cursor-pointer hover:bg-white/10 transition-all hover:border-green-500/50 font-semibold";
            btn.innerText = nome;
            btn.onclick = () => carregarModulo(nome, MODULOS[nome]);
            menuEl.appendChild(btn);
        });

        function atualizarBanner() {
            const wrapper = document.getElementById('ad-wrapper');
            wrapper.innerHTML = '<ins class="surfe-be" data-sid="420519"></ins>';
            if (window.adsurfebe) {
                (adsurfebe = window.adsurfebe || []).push({});
            }
        }

        function carregarModulo(nome, gid) {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('data-screen').classList.remove('hidden');
            document.getElementById('nome-modulo').innerText = nome;
            buscarDados(gid);
            if(intervalId) clearInterval(intervalId);
            if(adIntervalId) clearInterval(adIntervalId);
            
            iniciarCronometro(gid);
            atualizarBanner();
            adIntervalId = setInterval(atualizarBanner, 30000);
        }

        async function buscarDados(gid) {
            const url = URL_BASE.replace('{gid}', gid) + "&nocache=" + new Date().getTime();
            const container = document.getElementById('tabela-container');
            container.innerHTML = '<div class="py-10 text-center text-blue-400 text-sm">Carregando dados...</div>';
            
            const response = await fetch(url);
            const data = await response.text();
            Papa.parse(data, {
                header: true, skipEmptyLines: true,
                complete: (results) => {
                    container.innerHTML = "";
                    const table = document.createElement('table');
                    table.className = "w-full text-left border-separate border-spacing-0";
                    table.innerHTML = `<thead><tr class="bg-blue-950/50">${Object.keys(results.data[0]).map(h => `<th class="p-2 text-green-400 border-b border-white/10">${h}</th>`).join('')}</tr></thead>` +
                                      `<tbody>${results.data.map(row => `<tr class="hover:bg-white/5">${Object.values(row).map(v => `<td class="p-2 border-b border-white/5">${v}</td>`).join('')}</tr>`).join('')}</tbody>`;
                    container.appendChild(table);
                    document.getElementById('banner').classList.remove('hidden');
                }
            });
        }

        function iniciarCronometro(gid) {
            let seg = 300;
            intervalId = setInterval(() => {
                seg--;
                document.getElementById('contador').innerText = `Atualizando em: ${seg}s`;
                if(seg <= 0) { seg = 300; buscarDados(gid); }
            }, 1000);
        }

        function voltar() {
            clearInterval(intervalId);
            clearInterval(adIntervalId);
            document.getElementById('data-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('banner').classList.add('hidden');
        }
    </script>
</body>
</html>
